# ─────────────────────────────────────────────────────────────
# Webinar platform — production stack
#
# Every published port is driven by a variable so a deployment can move a
# service without editing this file. Copy `deploy/env.production.example` to
# `.env` at the repo root and adjust there.
#
# Networking note: `server`, `coturn` and `nginx` use host networking.
#
# mediasoup binds one UDP port per WebRTC transport, so a room of 500 people
# needs roughly 1000 ports. Publishing a range that wide through Docker's
# bridge would create one iptables rule per port and route every media packet
# through the userland proxy — measurable jitter and a slow `docker compose up`.
# Host networking lets the SFU bind the range directly. The remaining services
# stay on the bridge and are reached over loopback.
# ─────────────────────────────────────────────────────────────

name: webinar-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webinar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-webinar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only — the API reaches it over 127.0.0.1 because it
    # runs with host networking. Never expose this to the internet.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-webinar} -d ${POSTGRES_DB:-webinar}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
      args:
        # The Prisma schema ships as SQLite for zero-setup local dev. The image
        # rewrites the provider at build time so production runs on Postgres.
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    restart: unless-stopped
    # Host networking: the SFU binds the RTP range directly instead of having
    # Docker proxy every media port. See the note at the top of this file.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-webinar}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-webinar}?schema=public
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@webinar.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      RZP_KEY_ID: ${RZP_KEY_ID:-}
      RZP_KEY_SECRET: ${RZP_KEY_SECRET:-}
      RZP_WEBHOOK_SECRET: ${RZP_WEBHOOK_SECRET:-}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-2}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-42000}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-webinars@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      # Set to 1 to run `prisma db push` + seed the admin on container start.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time, so
        # changing the public URL requires a rebuild, not just a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost}
        NEXT_PUBLIC_RZP_KEY_ID: ${NEXT_PUBLIC_RZP_KEY_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:${WEB_PORT:-3000}'

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Host networking so it can reach the API and web on loopback and bind
    # HTTP_PORT directly.
    #
    # TLS is NOT handled here. Caddy on the VPS owns 80/443, terminates TLS,
    # and forwards plain HTTP to HTTP_PORT. So this container needs no certs
    # and no ACME webroot.
    network_mode: host
    depends_on:
      - web
      - server
    environment:
      # `./deploy.sh` renders the template into infra/nginx/rendered/ and that
      # file is mounted straight into conf.d, so the image's own envsubst step
      # is not used.
      HTTP_PORT: ${HTTP_PORT:-5173}
      SERVER_NAME: ${SERVER_NAME:-_}
      API_PORT: ${API_PORT:-4000}
      WEB_PORT: ${WEB_PORT:-3000}
    volumes:
      - ./infra/nginx/rendered:/etc/nginx/conf.d:ro

volumes:
  pgdata:
  redisdata:
